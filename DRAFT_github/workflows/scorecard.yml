# NOT ACTIVE — inert proposal outside .github/; nothing runs. Activation requires Ewa's explicit decision (no workflows / nothing paid). See DRAFT_github/README.md.
name: scorecard
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
permissions: read-all
jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@PIN
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@PIN
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@PIN
        with:
          sarif_file: results.sarif
